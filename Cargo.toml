[package]
name = "culture-and-arts"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "CultureAndArts: a TUI that probes your desktop environment and finds the ideal Google Arts & Culture wallpaper, downloading it at maximum resolution via a re-tooled dezoomify engine."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/grathwohl/culture-and-arts"
default-run = "culture-and-arts"

[[bin]]
name = "culture-and-arts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
reqwest = { version = "0.12", features = ["gzip"] }
futures = "0.3"
image = "0.25"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
ratatui = { version = "0.30", features = ["crossterm"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
